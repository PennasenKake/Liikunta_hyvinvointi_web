# ci.yml: jatkuva integraatio (Continuous Integration).
# Tarkistaa jokaisen pushin ja pull requestin automaattisesti GitHubin palvelimella.
# Jos tyyppitarkistus, lint, build tai savutestit epäonnistuvat, GitHub näyttää punaisen rastin
# commitin vieressä ja lähettää ilmoituksen. Näin rikkinäinen koodi huomataan heti
# eikä vasta julkaisussa.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Vähimmät oikeudet: työnkulku vain lukee koodia, ei muuta repoa (tietoturva).
permissions:
  contents: read

# Jos samaan haaraan pushataan uudestaan ennen kuin edellinen ajo on valmis,
# vanha ajo perutaan. Säästää aikaa, eikä vanhentuneen koodin tulosta tarvitse odottaa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tarkistus:
    name: Tarkistus, build ja testit
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Pysäyttää jumiin jääneen ajon, ettei se kuluta minuutteja turhaan

    # Next.js-sovellus on web-kansiossa, joten kaikki komennot ajetaan sieltä
    defaults:
      run:
        working-directory: web

    steps:
      # 1. Hakee repon koodin palvelimelle
      - name: Koodin haku
        uses: actions/checkout@v7

      # 2. Asentaa Noden ja ottaa npm-välimuistin käyttöön.
      #    Välimuisti nopeuttaa seuraavia ajoja, koska paketteja ei ladata joka kerta uudelleen.
      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22 # Next.js 16 vaatii vähintään 20.9:n
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 3. npm ci asentaa täsmälleen package-lock.jsonin mukaiset versiot.
      #    Toisin kuin npm install, se ei koskaan päivitä lukitustiedostoa.
      - name: Riippuvuuksien asennus
        run: npm ci

      # 4. TypeScript-tyyppitarkistus ja ESLint (sama kuin paikallisesti npm run check)
      - name: Tyyppitarkistus ja lint
        run: npm run check

      # 5. Tuotantobuild: varmistaa, että sivusto kääntyy samoin kuin julkaisussa
      - name: Tuotantobuild
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1 # Ei lähetetä Next.js:n käyttötilastoja CI-ajoista

      # 6. Asentaa testeissä käytettävän Chromium-selaimen ja sen Linux-kirjastot.
      #    Vain Chromium, koska molemmat testiprofiilit (työpöytä ja Pixel 7) käyttävät sitä.
      - name: Playwright-selaimen asennus
        run: npx playwright install --with-deps chromium

      # 7. Savutestit tuotantobuildia vastaan (web/e2e/savutesti.spec.ts).
      #    Playwright käynnistää palvelimen itse, koska build on jo tehty vaiheessa 5.
      - name: Savutestit
        run: npm run test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # 8. Jos testit epäonnistuvat, HTML-raportti tallennetaan ladattavaksi
      #    ajon Summary-sivulle (Artifacts). Raportissa näkyy, mikä testi kaatui ja miksi.
      - name: Testiraportin tallennus
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-raportti
          path: web/playwright-report/
          retention-days: 7 # Poistetaan viikon kuluttua, ettei tallennustilaa kulu turhaan
